<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Precios — Cofersa</title>
<style>
:root{
  --navy:#16324a; --navy-dark:#0e2233; --navy-50:#eef2f6;
  --gold:#c9902f; --gold-dark:#a8751f;
  --bg:#f4f5f7; --card:#ffffff; --border:#e1e4e9; --border-strong:#cbd0d8;
  --ink:#1b232e; --mut:#616b78; --rojo:#b3261e;
  --radius:8px; --radius-pill:999px;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-lg:0 8px 30px rgba(0,0,0,.18);
  font-family:-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
h1,h2,h3{margin:0}
button{font-family:inherit}
input[type=checkbox]{accent-color:#009ee3}
.hidden{display:none !important}

/* ---- Cortina de acceso ---- */

/* ---- Encabezado (estilo tienda en línea) ---- */
.siteHeader{position:relative;z-index:25;background:#fff}
.wrap{padding:0 22px}
.utilBar{border-bottom:1px solid var(--border);font-size:13.5px;color:#333}
.utilInner{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:10px 0;min-height:46px}
.utilRight{display:flex;align-items:center;gap:18px;min-width:0}
.clientSearchWrap{position:relative;width:300px;max-width:100%}
.clientSearchWrap input{width:100%;padding:7px 11px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:13.5px}
.clientResults{position:absolute;top:calc(100% + 6px);right:0;left:auto;width:min(440px,90vw);background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:280px;overflow-y:auto;z-index:20}
.clientResults .cr-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.clientResults .cr-item:last-child{border-bottom:0}
.clientResults .cr-item:hover{background:var(--navy-50)}
.cr-item .cr-name{font-weight:600;font-size:13.5px}
.cr-item .cr-meta{font-size:12px;color:var(--mut)}
.clientChip{display:none;align-items:center;gap:8px;min-width:0;font-size:14px;color:#333}
.clientChip.on{display:flex}
.clientChip .clientLabel{white-space:nowrap}
.clientChip svg{flex:none;width:19px;height:19px;color:#333}
.clientChip b{font-size:16px;font-weight:700;color:#1b232e;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clientChipCode{font-size:13px;color:var(--mut);white-space:nowrap}
.clientChip button{background:none;border:0;padding:0;font-size:13px;font-weight:600;color:#0082ba;text-decoration:underline;cursor:pointer;white-space:nowrap}

.mainBar{padding:22px 0}
.mainInner{display:flex;align-items:center;gap:36px}
.brand img{display:block;height:62px;width:auto}
.bigSearch{position:relative;flex:1;max-width:900px;margin:0 auto}
.bigSearch input{width:100%;height:48px;padding:0 54px 0 18px;border:1px solid #d6dae0;border-radius:10px;font-size:16px;color:var(--ink);box-shadow:0 2px 5px rgba(0,0,0,.16)}
.bigSearch input::placeholder{color:#9aa1ab}
.bigSearch svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:#222;pointer-events:none}
.headIcons{display:flex;align-items:center;gap:10px}
.iconBtn{position:relative;background:none;border:0;padding:6px;cursor:pointer;color:#222;display:flex}
.iconBtn svg{width:34px;height:34px}
.iconBadge{position:absolute;top:-2px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:#009ee3;color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

.viewToggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;background:#fff}
.vt-btn{background:#fff;border:0;padding:8px 11px;color:var(--mut);cursor:pointer;display:flex;align-items:center}
.vt-btn+.vt-btn{border-left:1px solid var(--border-strong)}
.vt-btn svg{width:18px;height:18px}
.vt-btn.active{background:#009ee3;color:#fff}
.gridTools{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--mut);margin:0 0 10px;cursor:pointer;width:max-content}
.gridTools input{cursor:pointer;margin:0}
.gridWrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gcard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.gimg{height:170px;background:#fff;border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gimg img{width:100%;height:100%;object-fit:contain;padding:10px;box-sizing:border-box}
.gnoimg{color:var(--border-strong);font-size:28px}
.gcheck{position:absolute;top:8px;left:8px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:4px;line-height:0}
.gcheck input{cursor:pointer;margin:0}
.gbody{padding:10px 12px 6px;flex:1}
.gchips{position:relative;display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.gchipRow{display:flex;gap:4px;min-height:22px;min-width:0;align-items:center}
.gchips .chip{margin-top:0;white-space:nowrap}
.gchips .chip:not(.promoChip){min-width:0;overflow:hidden;text-overflow:ellipsis}
.gchips .gchipMarca{flex:0 1 auto;max-width:55%}
.gdesc{font-weight:700;font-size:16px;line-height:1.3;height:3.9em;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.gcode{color:var(--mut);font-size:16px;margin-bottom:8px}
.gstats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gstat{background:var(--bg);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;min-height:52px}
.gval{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.gval.red{color:var(--rojo)}
.gval.na{color:var(--mut);font-weight:400;font-size:16px;white-space:normal}
.glabel{font-size:16px;color:var(--mut)}
.gdisp{font-size:16px;color:var(--mut);margin-top:6px}
.gfoot{padding:8px 12px 12px}
.gfoot .btn-add{width:100%;padding:10px;font-size:16px}
.gfoot .qtybox{justify-content:center}
.gfoot .qtybox input{flex:1;max-width:70px}
.gcard .promoChip{position:static}
.gcard .promoBubble{left:0;right:0;width:auto;max-width:none;bottom:calc(100% + 6px)}
.navBar{background:#009ee3}
.navInner{display:flex;align-items:center;gap:6px;min-height:52px}
.navItem{background:none;border:0;color:#fff;font-size:16px;font-weight:700;padding:13px 16px;cursor:pointer;border-radius:6px;white-space:nowrap}
.navItem:hover{background:rgba(255,255,255,.14)}
.navItem.active{background:rgba(255,255,255,.22)}
.crumbs{background:var(--bg);padding:14px 0;font-size:15px;color:#333}
.crumbs span.sep{margin:0 10px;color:#666}

/* ---- Layout principal ---- */
.layout{display:flex;align-items:flex-start;gap:22px;padding:16px 22px 0}
.sidebar{width:260px;flex:none;background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:10px 6px 10px 0;height:calc(100vh - 24px);overflow:hidden;position:sticky;top:12px}
.sidebarScroll{height:100%;overflow-y:auto;padding:6px 10px 6px 16px}
.sidebar h3{font-size:16px;text-transform:none;letter-spacing:0;color:var(--mut);margin:18px 0 8px}
.sidebar h3:first-child{margin-top:0}
.filterSearch{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:16px;margin-bottom:8px}
.filterGroup{max-height:210px;overflow-y:auto}
.filterGroup label{display:flex;align-items:center;gap:7px;font-size:15px;padding:3px 0;cursor:pointer}
.filterGroup input[type=checkbox]{flex:none}
.filterGroup .fcount{color:var(--mut);font-size:14px;margin-left:auto}
.filterHead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.filterHead h3{margin:0 !important}
.clearIconBtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border-strong);border-radius:8px;color:var(--mut);cursor:pointer;padding:0}
.clearIconBtn svg{width:18px;height:18px}
.clearIconBtn:hover{background:var(--bg);border-color:var(--mut)}

.main{flex:1;min-width:0;padding:0 0 100px}
.resultBar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:16px}
.resultLeft{display:flex;align-items:center;gap:14px;min-width:0}
.resultBar .count{font-size:13px;color:var(--mut)}

table.cat{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
table.cat thead th{background:#fff;text-align:left;font-size:16px;color:var(--mut);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.cat thead th.num{text-align:right}
table.cat tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:16px}
table.cat tbody tr:hover{background:var(--navy-50)}
td.num{text-align:right}
.prod-thumb{width:38px;height:38px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--border);padding:2px}
.prod-thumb.noimg{display:flex;align-items:center;justify-content:center;color:var(--border-strong);font-size:16px}
.prod-code{color:var(--mut);font-size:16px;white-space:nowrap}
.prod-desc{font-weight:600}
table.cat .btn-add{font-size:16px}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:var(--navy-50);border-radius:var(--radius-pill);padding:2px 8px;margin-top:3px}
.chip.bdf{color:var(--gold-dark);background:#fbf1e1}
.promoChip{position:relative;color:#3730a3;background:#eef0fd;cursor:help}
.promoBubble{display:none;position:absolute;left:0;bottom:calc(100% + 8px);z-index:25;width:260px;max-width:60vw;
  background:var(--card);color:var(--ink);font-size:12.5px;font-weight:400;line-height:1.4;text-align:left;
  padding:10px 12px;border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--border-strong);white-space:normal}
.promoChip:hover .promoBubble, .promoChip:focus .promoBubble{display:block}
.priceCell{font-weight:700;color:var(--rojo)}
.priceCell.na{color:var(--mut);font-weight:400;font-size:16px}
.qtybox{display:flex;align-items:center;gap:6px}
.qtybox button{width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border-strong);background:#fff;cursor:pointer;font-size:15px}
.qtybox input{width:44px;text-align:center;border:1px solid var(--border-strong);border-radius:var(--radius);padding:4px 2px;font-size:16px}
.btn-add{background:#009ee3;border:0;border-radius:var(--radius);padding:8px 14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap}
.btn-add:disabled{background:var(--border-strong);cursor:not-allowed}
.btn-add:hover:not(:disabled){background:#0082ba}
.selectCell{width:34px;text-align:center}
.selectCell input, th.selectCell input{cursor:pointer}
.actionsCell{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.empty{padding:50px;text-align:center;color:var(--mut)}

/* ---- Lista flotante ---- */
.fab-stack{position:fixed;right:20px;bottom:20px;z-index:30}
.list-btn{background:#009ee3;color:#fff;border:0;border-radius:var(--radius-pill);padding:13px 22px;font-size:15px;font-weight:700;box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;gap:8px}
.list-btn:hover{background:#0082ba}
.list-btn .badge{background:#fff;color:#009ee3;border-radius:var(--radius-pill);min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}

.list-panel{position:fixed;top:0;right:-440px;width:420px;max-width:92vw;height:100%;background:var(--card);box-shadow:-4px 0 24px rgba(0,0,0,.18);z-index:40;transition:right .25s ease;display:flex;flex-direction:column}
.list-panel.open{right:0}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.list-head h2{font-size:16px}
.list-head button{background:none;border:0;font-size:18px;cursor:pointer;color:var(--mut)}
.list-items{flex:1;overflow-y:auto;padding:10px 18px}
.list-empty{padding:40px 0;text-align:center;color:var(--mut);font-size:13.5px}
.list-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-item img{width:44px;height:44px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--border);flex:none}
.li-text{flex:1;min-width:0}
.li-text .li-desc{font-weight:600;font-size:13px}
.li-text .li-code{color:var(--mut);font-size:12px}
.li-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.li-price{font-weight:700;font-size:13px}
.li-remove{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px}
.li-remove:hover{color:var(--rojo)}
.list-footer{border-top:1px solid var(--border);padding:16px 18px}
.list-total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:12px}
.btn-primary{width:100%;padding:12px;background:#009ee3;color:#fff;border:0;border-radius:var(--radius);font-weight:700;font-size:14.5px;cursor:pointer}
.list-footer .btn-primary{flex:1;width:auto}
.genOptions{display:flex;gap:10px;margin-bottom:12px}
.genOptions label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.genOptions select,.genOptions input{padding:7px 8px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:13px;color:var(--ink)}
.btn-primary:disabled{background:var(--border-strong);cursor:not-allowed}
.btn-primary:hover:not(:disabled){background:#0082ba}

/* ---- Toast ---- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--radius-pill);font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .sidebar{display:none}
  .sidebar.open{display:block;position:fixed;top:0;left:0;bottom:0;width:82%;max-width:300px;z-index:50;height:100vh;border-radius:0 10px 10px 0;box-shadow:2px 0 20px rgba(0,0,0,.2)}
  .layout{padding:12px 14px 0;gap:0}
  .filterToggle{display:inline-flex !important}
  .gridWrap{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .resultBar{flex-wrap:wrap}
  .gstats{grid-template-columns:1fr}
  .gdesc{height:5.2em;-webkit-line-clamp:4}
  .gimg{height:130px}
  .utilInner{flex-wrap:wrap;gap:6px 14px}
  .utilRight{flex-wrap:wrap;gap:8px 14px;width:100%;justify-content:flex-end}
  .mainInner{flex-wrap:wrap;gap:12px}
  .brand img{height:42px}
  .bigSearch{order:3;flex:1 1 100%;max-width:none}
  .iconBtn svg{width:30px;height:30px}
  .navInner{overflow-x:auto}
  .navItem{font-size:16px;padding:13px 12px}
}
.filterToggle{display:none;align-items:center;gap:6px;padding:8px 12px;border:1px solid rgba(255,255,255,.75);border-radius:var(--radius);background:transparent;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
.sidebarOverlay.open{display:block}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* ======================= Utilidades ======================= */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2400);
}
function escAttr(s){ return String(s == null ? '' : s).replace(/"/g, '&quot;'); }
function money(n){ return '$ ' + (Number(n)||0).toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else field += c;
    } else if (c === '"'){
      inQuotes = true;
    } else if (c === ','){
      row.push(field); field = '';
    } else if (c === '\r'){
      /* ignorar */
    } else if (c === '\n'){
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

/* ======================= Fuentes de datos en vivo ======================= */
const SPREADSHEET_ID = '1QT3MBkca4M9QEHFoZgjC4dVPZmCiqpj38R6YVLBSn6I';
const ARTICULOS_URLS = [
  'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:csv&gid=655357259',

];
const CLIENTES_URLS = [
  'https://docs.google.com/spreadsheets/d/' + SPREADSHEET_ID + '/gviz/tq?tqx=out:csv&gid=814469810',
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vQzqvFIW3UbGsp1mpVC3Q7RZXF85d_T6O7cpEIOt5czUq3JmVqvhMXPdvQosD81ui2f36n5Y79jPdTx/pub?gid=814469810&single=true&output=csv'
];
const PHOTO_INDEX_URL = 'https://docs.google.com/spreadsheets/d/1biAtWEcnP0OpIwMV6gJzv3dmEl5veQQmM7ba3u95szY/gviz/tq?tqx=out:csv&gid=0';

const PRICE_LIST_COLUMNS = ['ARAGUAB','BOLIVARCVM','CARABOBENA','EPA','FERREBOT','GRUPOPICO','LARAB','LICCIONI','LPARAGUA','LPLARA','LPMARGARITAB','LPMARGARITAD','MAYOREOB','MAYOREOD','MAYOREOEPA','MAYOREOL','PILOTO D','PORTAL PILOT','PORTALARAGUB','PORTALARAGUD','PORTALCONTB','PORTALCONTD','PORTALD','PORTALLARAB','PORTALLARAD'];

let PRODUCTS = [];
let CLIENTS = [];
let DRIVE_IDS = {};
let selectedClient = null; // {code, name, nivelPrecio}
let list = {}; // codigo -> {qty}

async function fetchFirstWorking(urls){
  let lastErr = null;
  for (const url of urls){
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (!text || text.length < 10) throw new Error('vacío');
      return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('No se pudo obtener ningún enlace');
}

function buildProducts(text){
  const rows = parseCSV(text);
  const header = rows[0].map(h => h.trim());
  const idx = name => header.indexOf(name);
  const idxAny = (...names) => { for (const n of names){ const i = idx(n); if (i !== -1) return i; } return -1; };
  const iCodigo = idx('ARTICULO'), iDesc = idx('DESCRIPCION'), iDisp = idx('CANTIDAD_DISPONIBLE'),
        iCat = idx('DESC_CLASIFICACION_1'), iSub = idx('DESC_CLASIFICACION_2'), iMarca = idx('DESC_CLASIFICACION_3'),
        iBdf = idx('DESC_CLASIFICACION_4'), iEstado = idx('CLASIFICACION_6'), iInfaltable = idx('U_INFALTABLE'), iFactor = idx('FACTOR_VENTA'),
        iPromo = idxAny('Promoción', 'Promocion', 'PROMOCION', 'PROMOCIÓN', 'Promo', 'PROMO');
  const priceIdx = PRICE_LIST_COLUMNS.map(c => idx(c));

  const out = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    const codigo = (row[iCodigo] || '').trim();
    if (!codigo) continue;
    const estado = (row[iEstado] || '').trim();
    if (estado !== 'P1') continue; // solo productos "Disponible para la venta"
    const disponible = parseFloat(row[iDisp]) || 0;
    if (disponible <= 0) continue; // se ocultan los productos sin existencia
    const precios = {};
    PRICE_LIST_COLUMNS.forEach((col, i) => {
      const v = parseFloat(row[priceIdx[i]]);
      precios[col] = Number.isFinite(v) ? v : null;
    });
    out.push({
      codigo,
      descripcion: (row[iDesc] || '').trim(),
      disponible,
      categoria: (row[iCat] || '').trim() || 'Sin categoría',
      subcategoria: (row[iSub] || '').trim() || 'Sin subcategoría',
      marca: (row[iMarca] || '').trim() || 'Sin marca',
      bdf: (row[iBdf] || '').trim() || 'Sin clasificación',
      infaltable: (row[iInfaltable] || '').trim() === 'SI',
      factorVenta: Math.max(1, Math.round(parseFloat(row[iFactor])) || 1),
      promocion: iPromo === -1 ? '' : (row[iPromo] || '').trim(),
      precios
    });
  }
  return out;
}

function buildClients(text){
  const rows = parseCSV(text);
  const header = rows[0].map(h => h.trim());
  const idx = name => header.indexOf(name);
  const iCode = idx('CLIENTE'), iName = idx('NOMBRE'), iNivel = idx('NIVEL_PRECIO'), iActivo = idx('ACTIVO');
  const out = [];
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    const code = (row[iCode] || '').trim();
    if (!code) continue;
    if (iActivo !== -1 && (row[iActivo] || '').trim() !== 'S') continue;
    out.push({
      code,
      name: (row[iName] || '').trim(),
      nivelPrecio: (row[iNivel] || '').trim()
    });
  }
  return out;
}

function buildDriveIndex(text){
  const rows = parseCSV(text);
  const header = rows[0].map(h => h.trim());
  const iCodigo = header.indexOf('Nombre limpio') === -1 ? 1 : header.indexOf('Nombre limpio');
  const iId = header.indexOf('ID') === -1 ? 3 : header.indexOf('ID');
  const out = {};
  for (let r = 1; r < rows.length; r++){
    const row = rows[r];
    const codigo = (row[iCodigo] || '').trim();
    const id = (row[iId] || '').trim();
    if (codigo && id && !(codigo in out)) out[codigo] = id;
  }
  return out;
}

function getPhotoSrcMed(codigo){

/* ======================= Estado de filtros ======================= */
let activeFilters = { marca: new Set(), categoria: new Set(), subcategoria: new Set(), bdf: new Set() };
let searchQuery = '';
let marcaSearchQuery = '';
let subSearchQuery = '';

function priceFor(product){
  if (!selectedClient) return null;
  const v = product.precios[selectedClient.nivelPrecio];
  return (v == null) ? null : v;
}

let onlyPromo = false; // "Oportunidades": solo productos con promoción

function filteredProducts(){
  const q = searchQuery.trim().toLowerCase();
  return PRODUCTS.filter(p => {
    if (onlyPromo && !p.promocion) return false;
    if (activeFilters.marca.size && !activeFilters.marca.has(p.marca)) return false;
    if (activeFilters.categoria.size && !activeFilters.categoria.has(p.categoria)) return false;
    if (activeFilters.subcategoria.size && !activeFilters.subcategoria.has(p.subcategoria)) return false;
    if (activeFilters.bdf.size && !activeFilters.bdf.has(p.bdf)) return false;
    if (q){
      const hay = (p.codigo + ' ' + p.descripcion + ' ' + p.marca).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function countsBy(field){
  const counts = {};
  PRODUCTS.forEach(p => { counts[p[field]] = (counts[p[field]] || 0) + 1; });
  return counts;
}

/* Productos que cumplen todos los filtros activos EXCEPTO el del propio campo
   (así cada grupo de filtro refleja el efecto de los demás, sin autolimitarse) */
function productsMatchingFiltersExcept(excludeField){
  const q = searchQuery.trim().toLowerCase();
  return PRODUCTS.filter(p => {
    if (onlyPromo && !p.promocion) return false;
    if (excludeField !== 'marca' && activeFilters.marca.size && !activeFilters.marca.has(p.marca)) return false;
    if (excludeField !== 'categoria' && activeFilters.categoria.size && !activeFilters.categoria.has(p.categoria)) return false;
    if (excludeField !== 'subcategoria' && activeFilters.subcategoria.size && !activeFilters.subcategoria.has(p.subcategoria)) return false;
    if (excludeField !== 'bdf' && activeFilters.bdf.size && !activeFilters.bdf.has(p.bdf)) return false;
    if (q){
      const hay = (p.codigo + ' ' + p.descripcion + ' ' + p.marca).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function countsByField(products, field){
  const counts = {};
  products.forEach(p => { counts[p[field]] = (counts[p[field]] || 0) + 1; });
  return counts;
}

/* Quita del estado cualquier selección que ya no tenga productos bajo los demás filtros activos */
function pruneInvalidSelections(){
  ['marca','categoria','subcategoria','bdf'].forEach(field => {
    const relevant = productsMatchingFiltersExcept(field);
    const validValues = new Set(relevant.map(p => p[field]));
    Array.from(activeFilters[field]).forEach(v => { if (!validValues.has(v)) activeFilters[field].delete(v); });
  });
}

function renderFilterGroup(containerId, field, searchQ){
  const el = $('#' + containerId);
  const relevant = productsMatchingFiltersExcept(field);
  const counts = countsByField(relevant, field);
  let entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  if (searchQ) entries = entries.filter(([name]) => name.toLowerCase().includes(searchQ.toLowerCase()));
  el.innerHTML = entries.map(([name, count]) => {
    const isChecked = activeFilters[field].has(name);
    return `<label><input type="checkbox" data-field="${field}" value="${escAttr(name)}" ${isChecked?'checked':''}> ${name} <span class="fcount">${count}</span></label>`;
  }).join('') || '<div style="color:var(--mut);font-size:15px">Sin resultados con los filtros actuales</div>';
}

function renderAllFilterGroups(){
  renderFilterGroup('groupMarca', 'marca', marcaSearchQuery);
  renderFilterGroup('groupCategoria', 'categoria', '');
  renderFilterGroup('groupSubcategoria', 'subcategoria', subSearchQuery);
  renderFilterGroup('groupBdf', 'bdf', '');
}

document.addEventListener('change', e => {

    const field = e.target.dataset.field;
    const val = e.target.value;
    if (e.target.checked) activeFilters[field].add(val);
    else activeFilters[field].delete(val);

  const filtered = filteredProducts();

  const msgMas = `Mostrando los primeros ${MAX_RENDER} de ${filtered.length} resultados. Afina la búsqueda o los filtros para ver más.`;
  if (viewMode === 'cuadricula'){
    $('#tbody').innerHTML = '';

      ? `<div class="empty" style="grid-column:1/-1">${msgVacio}</div>`
      : toRender.map(cardHtml).join('') + (filtered.length > MAX_RENDER ? `<div class="empty" style="grid-column:1/-1">${msgMas}</div>` : '');

    <div class="gimg">${img}</div>

function setQty(codigo, qty){
  const p = PRODUCTS.find(x => x.codigo === codigo);
  if (!p) return;
  qty = Math.max(0, Math.floor(qty) || 0);
  if (qty === 0) delete list[codigo];
  else list[codigo] = { qty };
  updateListUI();
  const row = document.querySelector(`tr[data-codigo="${CSS.escape(codigo)}"]`);
  if (row) row.outerHTML = rowHtml(p);
  const card = document.querySelector(`.gcard[data-codigo="${CSS.escape(codigo)}"]`);

}

function listLines(){
  return Object.keys(list).map(codigo => {
    const p = PRODUCTS.find(x => x.codigo === codigo);
    if (!p) return null;
    const qty = list[codigo].qty;
    const price = priceFor(p) || 0;
    // Precio de empaque provisional: precio unitario × unidades del empaque (sin descuento),
    // mientras no conectemos la base de descuentos por volumen.
    const precioEmpaque = price * p.factorVenta;
    return { codigo, desc: p.descripcion, marca: p.marca, categoria: p.categoria, qty, price, precioEmpaque, subtotal: price * qty, factorVenta: p.factorVenta, promocion: p.promocion || '' };
  }).filter(Boolean);
}

// Agrupa las líneas por categoría o marca (o las deja en un solo bloque si no se pidió agrupar)
function groupLines(lines, mode){
  if (mode !== 'categoria' && mode !== 'marca') return [{ nombre: null, items: lines }];
  const groups = {};
  const order = [];
  lines.forEach(l => {
    const key = mode === 'categoria' ? (l.categoria || 'Sin categoría') : (l.marca || 'Sin marca');
    if (!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(l);
  });
  return order.map(nombre => ({ nombre, items: groups[nombre] }));
}

function updateListUI(){
  const lines = listLines();

async function urlToBase64(url){
  try {
    const proxied = 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, ''));
    const res = await fetch(proxied);
    if (!res.ok) return null;
    const blob = await res.blob();
    return await new Promise(resolve => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  } catch (e) { return null; }
}

const PHOTO_COL_WIDTH_CHARS = 18; // ancho de la columna "Foto"
const PHOTO_ROW_HEIGHT_PTS = 85; // alto de fila para cada línea de producto (holgado a propósito)
const PHOTO_MAX_PX = 42; // tamaño máximo (ancho y alto) de la foto en píxeles, fijo y conservador

// Mide el ancho/alto real de una imagen (con límite de tiempo, por si falla la decodificación)
function getImageNaturalSize(dataUrl){
  return new Promise((resolve) => {
    let done = false;
    const finish = (w, h) => { if (!done){ done = true; resolve({ w: w || 1, h: h || 1 }); } };
    const img = new Image();
    img.onload = () => finish(img.naturalWidth, img.naturalHeight);
    img.onerror = () => finish(1, 1);
    img.src = dataUrl;
    setTimeout(() => finish(1, 1), 1200);
  });
}

// Anclaje de la foto dentro de la celda "Foto" de su fila.
// - Tamaño: la foto se escala a un máximo fijo (PHOTO_MAX_PX) conservando su proporción real, así no se deforma.
// - Posición: se da en medidas nativas de Excel (EMU, 1 px = 9525 EMU) dentro de UNA sola celda. Se evita
//   usar fracciones de celda (col: 0.3, row: 5.2), porque ExcelJS las convierte con sus propias medidas de
//   columna/fila y la foto sale como una tira angosta.
// - Anclaje de rango ("mover y cambiar de tamaño con las celdas"): así Excel borra la foto junto con su fila.
const EMU_POR_PX = 9525;
const PHOTO_INSET_X_PX = 4, PHOTO_INSET_Y_PX = 7; // pequeño margen desde la esquina superior izquierda de la celda
function computePhotoAnchor(natW, natH, rowIdx){
  const scale = Math.min(PHOTO_MAX_PX / natW, PHOTO_MAX_PX / natH);
  const extW = natW * scale, extH = natH * scale;
  const emu = px => Math.round(px * EMU_POR_PX);
  return {
    tl: { nativeCol: 0, nativeColOff: emu(PHOTO_INSET_X_PX), nativeRow: rowIdx - 1, nativeRowOff: emu(PHOTO_INSET_Y_PX) },
    br: { nativeCol: 0, nativeColOff: emu(PHOTO_INSET_X_PX + extW), nativeRow: rowIdx - 1, nativeRowOff: emu(PHOTO_INSET_Y_PX + extH) }
  };
}

function formatVigencia(){
  const v = $('#vigenteHasta').value;
  if (!v) return '';
  const [y,m,d] = v.split('-');
  return d + '/' + m + '/' + y;
}

$('#btnExportExcel').addEventListener('click', async () => {
  const lines = listLines();
  if (!lines.length) return;
  const btn = $('#btnExportExcel');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando...';
  try {
    const agrupar = $('#agruparPor').value;
    const vigencia = formatVigencia();
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Lista de precios');
    ws.columns = [
      { header: 'Foto', key: 'foto', width: PHOTO_COL_WIDTH_CHARS },
      { header: 'Código', key: 'codigo', width: 16 },
      { header: 'Descripción', key: 'desc', width: 42 },
      { header: 'Marca', key: 'marca', width: 18 },
      { header: 'Precio unitario', key: 'precio', width: 14 },
      { header: 'Precio empaque', key: 'precioEmpaque', width: 15 },
      { header: 'Cantidad empaque', key: 'empaque', width: 16 },
      { header: 'Cantidad pedido', key: 'pedido', width: 16 },
      { header: 'Total línea', key: 'total', width: 16 },
      { header: 'Promoción', key: 'promocion', width: 36 }
    ];
    let infoRows = 0;
    if (selectedClient){
      ws.insertRow(1, ['Cliente:', selectedClient.name + ' (' + selectedClient.code + ')']);
      ws.getRow(1).font = { bold: true };
      infoRows++;
    }
    if (vigencia){
      ws.insertRow(infoRows + 1, ['Vigente hasta:', vigencia]);
      ws.getRow(infoRows + 1).font = { bold: true };
      infoRows++;
    }
    ws.insertRow(infoRows + 1, ['Escriba la cantidad a pedir en "Cantidad pedido" (el total de cada línea se calcula solo), o elimine la fila del producto que no desee incluir.']);
    infoRows++;
    if (infoRows > 0){ ws.insertRow(infoRows + 1, []); infoRows++; }
    const headerRowIdx = infoRows + 1;
    ws.getRow(headerRowIdx).font = { bold: true };

    const groups = groupLines(lines, agrupar);
    let rowIdx = headerRowIdx;
    const dataRowIdxs = [];
    for (const g of groups){
      if (g.nombre){
        rowIdx++;
        ws.getRow(rowIdx).values = [g.nombre];
        ws.getRow(rowIdx).font = { bold: true };
        ws.mergeCells(rowIdx, 1, rowIdx, 10);
        ws.getRow(rowIdx).eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEFF2F6' } }; });
      }
      for (const l of g.items){
        rowIdx++;
        dataRowIdxs.push(rowIdx);
        const row = ws.getRow(rowIdx);
        row.getCell('codigo').value = l.codigo;
        row.getCell('desc').value = l.desc;
        row.getCell('marca').value = l.marca;
        row.getCell('precio').value = l.price;
        row.getCell('precioEmpaque').value = l.precioEmpaque;
        row.getCell('empaque').value = l.factorVenta;
        row.getCell('pedido').value = null;
        // Fórmula: paquetes completos a precio de empaque + lo que sobra a precio unitario.
        row.getCell('total').value = {
          formula: `IF(H${rowIdx}="","",INT(H${rowIdx}/G${rowIdx})*F${rowIdx}+MOD(H${rowIdx},G${rowIdx})*E${rowIdx})`
        };
        row.getCell('promocion').value = l.promocion;
        row.height = PHOTO_ROW_HEIGHT_PTS;

        const photoUrl = getPhotoSrcBig(l.codigo);
        if (photoUrl){
          const dataUrl = await urlToBase64(photoUrl);
          if (dataUrl){
            const ext = dataUrl.startsWith('data:image/png') ? 'png' : 'jpeg';
            const imgId = wb.addImage({ base64: dataUrl, extension: ext });
            const { w: natW, h: natH } = await getImageNaturalSize(dataUrl);
            const anchor = computePhotoAnchor(natW, natH, rowIdx);
            // Ancla la imagen centrada dentro de la celda, escalada sin deformar
            // (como object-fit:contain), en vez de estirarla para llenar la celda.
            ws.addImage(imgId, { tl: anchor.tl, br: anchor.br, editAs: 'twoCell' });
          }
        }
      }
    }
    if (dataRowIdxs.length){
      rowIdx++;
      ws.getRow(rowIdx).getCell('empaque').value = 'Total general';
      ws.getRow(rowIdx).getCell('empaque').font = { bold: true };
      const totalCell = ws.getRow(rowIdx).getCell('total');
      totalCell.value = { formula: `SUM(I${dataRowIdxs[0]}:I${dataRowIdxs[dataRowIdxs.length - 1]})` };
      totalCell.font = { bold: true };
    }
    // Sin protección: así se pueden borrar filas de productos libremente (Excel no permite
    // borrar filas con celdas bloqueadas, ni activando el permiso "Eliminar filas").

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const safeName = (selectedClient ? selectedClient.name : 'lista').replace(/[^a-z0-9]+/gi,'_').slice(0,40);
    a.download = `Lista_precios_${safeName}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Excel generado ✓');
  } catch (err){
    console.error('Error generando Excel:', err);
    alert('Ocurrió un error generando el Excel. Intenta de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
});

/* ======================= Exportar a PDF (mismo formato que la cotización) ======================= */
function nextPedidoNumero(){
  let n = parseInt(localStorage.getItem('portalprecios_pedido_seq') || '0', 10) + 1;
  if (!Number.isFinite(n) || n < 1) n = 1;
  localStorage.setItem('portalprecios_pedido_seq', String(n));
  return String(n).padStart(4, '0');
}

$('#btnExportPDF').addEventListener('click', async () => {
  const lines = listLines();
  if (!lines.length) return;
  const btn = $('#btnExportPDF');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando...';
  try {
    const agrupar = $('#agruparPor').value;
    const vigencia = formatVigencia();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 14;
    const rightX = pageW - marginX;
    const BLUE = [0, 158, 227]; // #009ee3

    const now = new Date();
    const fecha = now.toLocaleDateString('es-VE');
    const hora = now.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' });
    const pedidoNumero = nextPedidoNumero();

    // Marca de agua con el nombre del cliente, en cada página (desalienta que la lista circule).
    function drawWatermark(){
      if (!selectedClient) return;
      doc.setFont(undefined, 'bold');
      doc.setFontSize(42);
      doc.setTextColor(236, 238, 241);
      doc.text(selectedClient.name, pageW / 2, pageH / 2, { align: 'center', angle: 35 });
    }
    drawWatermark();

    function drawHeader(){
      doc.setFont(undefined, 'bold');
      doc.setFontSize(20);
      doc.setTextColor(20, 24, 33);
      doc.text('Pedido sugerido', rightX, 20, { align: 'right' });
      doc.setFont(undefined, 'normal');
      doc.setFontSize(9);
      doc.setTextColor(70, 75, 85);
      doc.text('Nro. ' + pedidoNumero, rightX, 27, { align: 'right' });
      doc.text('Fecha: ' + fecha, rightX, 32, { align: 'right' });
      doc.text('Hora: ' + hora, rightX, 37, { align: 'right' });

      doc.setFont(undefined, 'bold');
      doc.setFontSize(16);
      doc.setTextColor(...BLUE);
      doc.text('Portal de Precios', marginX, 20);
    }

    drawHeader();

    const totalGeneral = lines.reduce((a,l) => a + l.subtotal, 0);
    let y = 48;
    doc.setFillColor(...BLUE);
    doc.roundedRect(marginX, y, rightX - marginX, 22, 2, 2, 'F');
    doc.setFont(undefined, 'normal');
    doc.setFontSize(10);
    doc.setTextColor(255, 255, 255);
    doc.text('Total pedido sugerido', marginX + 6, y + 8);
    doc.setFont(undefined, 'bold');
    doc.setFontSize(18);
    doc.text(money(totalGeneral), marginX + 6, y + 17);
    y += 22 + 10;

    doc.setFont(undefined, 'bold');
    doc.setFontSize(9);
    doc.setTextColor(...BLUE);
    doc.text('Datos del cliente', marginX, y);
    y += 6;
    doc.setFont(undefined, 'bold');
    doc.setFontSize(12);
    doc.setTextColor(20, 24, 33);
    doc.text(selectedClient ? selectedClient.name : '—', marginX, y);
    y += 5;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(10);
    doc.setTextColor(40, 44, 52);
    doc.text('Código: ' + (selectedClient ? selectedClient.code : '—'), marginX, y);
    y += 5;
    if (vigencia){
      doc.text('Vigente hasta: ' + vigencia, marginX, y);
      y += 5;
    }
    y += 3;

    const groups = groupLines(lines, agrupar);
    const flatEntries = [];
    groups.forEach(g => {
      if (g.nombre) flatEntries.push({ type: 'group', nombre: g.nombre });
      g.items.forEach(l => flatEntries.push({ type: 'item', line: l }));
    });
    const rows = flatEntries.map(e => e.type === 'group'
      ? [{ content: e.nombre, colSpan: 6, styles: { fontStyle: 'bold', fillColor: [240, 242, 245], textColor: [37, 35, 38] } }]
      : ['', e.line.desc + '\nCódigo: ' + e.line.codigo + (e.line.marca ? '\nMarca: ' + e.line.marca : ''),
         String(e.line.qty), money(e.line.price), money(e.line.precioEmpaque), money(e.line.subtotal)]
    );
    const imgColW = 20;
    const imgRows = await Promise.all(flatEntries.map(async e => {
      if (e.type !== 'item') return null;
      const src = getPhotoSrcBig(e.line.codigo);
      return src ? await urlToBase64(src) : null;
    }));

    function drawContinuationHeader(){
      doc.setFont(undefined, 'bold');
      doc.setFontSize(10);
      doc.setTextColor(40, 44, 52);
      doc.text('Pedido sugerido ' + pedidoNumero + (selectedClient ? ' — ' + selectedClient.name : ''), marginX, 14);
    }
    function drawPageFooter(data){
      if (data.pageNumber > 1){ drawWatermark(); drawContinuationHeader(); }
      const footY = doc.internal.pageSize.getHeight() - 12;
      doc.setDrawColor(222, 226, 230);
      doc.setLineWidth(0.3);
      doc.line(marginX, footY - 5, rightX, footY - 5);
      doc.setFont(undefined, 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(140, 145, 155);
      const footText = 'Precios y cantidades sujetas a cambio sin previo aviso · Precios no incluyen IVA' + (vigencia ? ' · Vigente hasta ' + vigencia : '');
      doc.text(footText, pageW / 2, footY, { align: 'center' });
    }

    doc.autoTable({
      startY: y,
      head: [['Imagen', 'Artículo', 'Cantidad empaque', 'Precio Unitario', 'Precio Empaque', 'Subtotal']],
      body: rows,
      theme: 'plain',
      styles: { fontSize: 9, cellPadding: { top: 4, bottom: 4, left: 3, right: 3 }, lineWidth: { bottom: 0.2 }, lineColor: [222, 226, 230], minCellHeight: 20, valign: 'middle' },
      headStyles: { fillColor: [240, 242, 245], textColor: [90, 95, 105], fontStyle: 'bold', lineWidth: 0, cellPadding: { top: 2.5, bottom: 2.5, left: 3, right: 3 }, minCellHeight: 0 },
      columnStyles: {
        0: { cellWidth: imgColW },
        2: { cellWidth: 20, halign: 'right' },
        3: { cellWidth: 26, halign: 'right' },
        4: { cellWidth: 26, halign: 'right' },
        5: { cellWidth: 26, halign: 'right' }
      },
      didParseCell: function(data){ if ([2,3,4,5].includes(data.column.index)) data.cell.styles.halign = 'right'; },
      margin: { top: 16, left: marginX, right: marginX, bottom: 18 },
      didDrawCell: function(data){
        if (data.column.index === 0 && data.cell.section === 'body'){
          const src = imgRows[data.row.index];
          if (src){
            const pad = 2;
            const size = Math.min(data.cell.width - pad * 2, data.cell.height - pad * 2);
            const x = data.cell.x + (data.cell.width - size) / 2;
            const yImg = data.cell.y + (data.cell.height - size) / 2;
            const formato = src.startsWith('data:image/png') ? 'PNG' : 'JPEG';
            try { doc.addImage(src, formato, x, yImg, size, size); } catch (e) { /* ignora fotos con formato inesperado */ }
          }
        }
      },
      didDrawPage: drawPageFooter
    });

    let nextY = doc.lastAutoTable.finalY + 10;
    if (nextY + 14 > doc.internal.pageSize.getHeight() - 20){ doc.addPage(); nextY = 24; }
    doc.setFillColor(...BLUE);
    doc.roundedRect(marginX, nextY, rightX - marginX, 12, 1.5, 1.5, 'F');
    doc.setFont(undefined, 'bold');
    doc.setFontSize(11);
    doc.setTextColor(255, 255, 255);
    doc.text('Total $', marginX + 5, nextY + 8);
    doc.text(money(totalGeneral), rightX - 5, nextY + 8, { align: 'right' });

    const safeName = (selectedClient ? selectedClient.name : 'lista').replace(/[^a-z0-9]+/gi, '_').slice(0, 40);
    doc.save(`Pedido_sugerido_${pedidoNumero}_${safeName}.pdf`);
    toast('PDF generado ✓');
  } catch (err){
    console.error('Error generando el PDF:', err);
    alert('Ocurrió un error generando el PDF. Intenta de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
});

/* ======================= Carga inicial ======================= */
const DEFAULT_CLIENT_CODE = ''; // Cofersa: sin cliente por defecto por ahora (el de Febeca no aplica)

async function init(){
  try {
    const [articulosCsv, clientesCsv] = await Promise.all([
      fetchFirstWorking(ARTICULOS_URLS),
      fetchFirstWorking(CLIENTES_URLS)
    ]);
    PRODUCTS = buildProducts(articulosCsv);
    CLIENTS = buildClients(clientesCsv);
    renderAllFilterGroups();
    const defaultClient = CLIENTS.find(c => c.code === DEFAULT_CLIENT_CODE);
    if (defaultClient) selectClient(defaultClient);
    else renderTable();
  } catch (err){
    console.error('Error cargando catálogo/clientes:', err);
    $('#resultCount').textContent = 'No se pudo cargar el catálogo. Verifica tu conexión y recarga la página.';
  }

  try {
    const photoCsv = await fetchFirstWorking([PHOTO_INDEX_URL]);
    DRIVE_IDS = buildDriveIndex(photoCsv);
    renderTable();
  } catch (err){
    console.error('No se pudo cargar el índice de fotos:', err);
  }
}
init();

// Vigencia por defecto: 30 días a partir de hoy
(function setDefaultVigencia(){
  const d = new Date();
  d.setDate(d.getDate() + 30);
  const iso = d.toISOString().slice(0, 10);
  const el = $('#vigenteHasta');
  if (el) el.value = iso;
})();
</script>
